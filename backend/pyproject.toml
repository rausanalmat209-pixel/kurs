[project]
name = "qadam-backend"
version = "0.1.0"
description = "Қадам ойыны backend-і (AI-Driven Development курсы, 4-сабақ)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = ["E501"]  # ұзын жолдарды line-length арқылы басқарамыз
